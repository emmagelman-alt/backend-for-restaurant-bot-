<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Recs Demo</title>
  <style>
    body { margin: 0; font-family: "Comic Sans MS", "Patrick Hand", cursive; background: #f4efe6; }
    .scene { position: relative; max-width: 900px; margin: 40px auto; padding: 0 16px; display: flex; gap: 24px; align-items: flex-end; }

    /* Stand-ins for the real whiteboard + cartoon in index.html */
    .whiteboard { position: relative; flex: 1; height: 420px; background: #fff; border: 10px solid #9aa0a6; border-radius: 6px; overflow: hidden; }
    .notes { padding: 24px; color: #555; }
    .me { width: 160px; height: 220px; background: #ffd9b3; border-radius: 80px 80px 12px 12px; position: relative; display: grid; place-items: center; }

    /* "need a restaurant rec?" speech bubble */
    .rec-bubble { position: absolute; top: -56px; left: -40px; background: #fff; border: 2px solid #222; border-radius: 18px;
                  padding: 8px 14px; cursor: pointer; font: inherit; white-space: nowrap; animation: bob 2s ease-in-out infinite; }
    .rec-bubble::after { content: ""; position: absolute; bottom: -10px; right: 30px; border: 8px solid transparent; border-top-color: #222; }
    @keyframes bob { 50% { transform: translateY(-4px); } }

    /* Chat panel drawn on top of the whiteboard */
    .chat { position: absolute; inset: 0; background: #fff; display: flex; flex-direction: column; }
    .chat[hidden] { display: none; }
    .chat header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 2px dashed #ccc; }
    .chat header button { border: none; background: none; font-size: 22px; cursor: pointer; }
    .log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; line-height: 1.35; }
    .msg.user { align-self: flex-end; background: #2b6cb0; color: #fff; }
    .msg.bot  { align-self: flex-start; background: #f1f1f1; }
    .msg ul { margin: 6px 0 0; padding-left: 18px; }
    .msg li small { color: #666; }
    .msg.typing { color: #888; font-style: italic; }
    form { display: flex; gap: 8px; padding: 10px 14px; border-top: 2px dashed #ccc; }
    input { flex: 1; font: inherit; padding: 8px 10px; border: 2px solid #222; border-radius: 10px; }
    form button { font: inherit; padding: 8px 14px; border: 2px solid #222; border-radius: 10px; background: #ffe066; cursor: pointer; }

    @media (max-width: 640px) { .scene { flex-direction: column-reverse; align-items: center; } .whiteboard { width: 100%; } }
  </style>
</head>
<body>
  <div class="scene">
    <div class="whiteboard">
      <div class="notes" id="notes">(project notes live here)</div>

      <section class="chat" id="chat" hidden aria-label="Restaurant recommendations chat">
        <header>
          <strong>🍜 Emma’s eats</strong>
          <button type="button" id="close-chat" aria-label="Close chat">×</button>
        </header>
        <div class="log" id="log" aria-live="polite"></div>
        <form id="chat-form">
          <input id="chat-input" autocomplete="off" maxlength="500"
                 placeholder="e.g. sushi in NYC" />
          <button type="submit">Send</button>
        </form>
      </section>
    </div>

    <div class="me">
      (cartoon Emma)
      <button type="button" class="rec-bubble" id="rec-bubble">need a restaurant rec?</button>
    </div>
  </div>

  <script>
    // Local backend while developing, Render in production.
    const API_URL = location.hostname === 'localhost' || location.protocol === 'file:'
      ? 'http://localhost:8000/api/recs'
      : 'https://emma-restaurant-recs.onrender.com/api/recs';

    const chat = document.getElementById('chat');
    const notes = document.getElementById('notes');
    const log = document.getElementById('log');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const history = [];  // [{role, content}] sent back so follow-ups keep context

    function addMessage(role, text, places = []) {
      const div = document.createElement('div');
      div.className = `msg ${role === 'user' ? 'user' : 'bot'}`;
      div.textContent = text;  // textContent, never innerHTML, for anything from the network
      if (places.length) {
        const ul = document.createElement('ul');
        for (const p of places) {
          const li = document.createElement('li');
          li.append(`${p.name} `);
          const meta = document.createElement('small');
          meta.textContent = `(${p.score.toFixed(1)} · ${p.city} · ${p.cuisines.join(', ') || p.category})`;
          li.append(meta);
          ul.append(li);
        }
        div.append(ul);
      }
      log.append(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function openChat() {
      chat.hidden = false;
      notes.hidden = true;
      if (!log.children.length) {
        addMessage('bot', 'Hi! Tell me a city (or country) and a cuisine or type of place, and I’ll share my 8.0+ spots from Beli.');
      }
      input.focus();
    }

    function closeChat() {
      chat.hidden = true;
      notes.hidden = false;
    }

    document.getElementById('rec-bubble').addEventListener('click', openChat);
    document.getElementById('close-chat').addEventListener('click', closeChat);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !chat.hidden) closeChat(); });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      addMessage('user', message);
      const typing = addMessage('bot', 'thinking…');
      typing.classList.add('typing');
      form.querySelector('button').disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history: history.slice(-12) }),
        });
        const data = await res.json();
        typing.remove();
        if (!res.ok) throw new Error(data.detail || 'Something went wrong.');
        addMessage('bot', data.reply, data.places);
        history.push({ role: 'user', content: message }, { role: 'assistant', content: data.reply });
      } catch (err) {
        typing.remove();
        // Render's free tier sleeps; the first request can take ~30-50s or fail.
        addMessage('bot', err.message.includes('fetch')
          ? 'Hmm, I’m waking up. Give it a few seconds and try again!'
          : err.message);
      } finally {
        form.querySelector('button').disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
